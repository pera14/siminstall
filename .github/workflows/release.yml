name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Import signing certificate (optional)
        if: env.MACOS_CERT_P12 != ''
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
          rm cert.p12

      - name: Build app + DMG
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || VERSION="0.0.0-${GITHUB_SHA::7}"
          scripts/build-app.sh "$VERSION"
          scripts/make-dmg.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: SimInstall
          path: build/*.dmg*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.dmg*
          generate_release_notes: true

  homebrew:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - name: Update Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          URL="https://github.com/$OWNER/$REPO/releases/download/v$VERSION/SimInstall-$VERSION.dmg"
          SHA=$(curl -fsSL "$URL" | shasum -a 256 | cut -d' ' -f1)
          git clone "https://x-access-token:$TAP_TOKEN@github.com/$OWNER/homebrew-tap.git" tap
          mkdir -p tap/Casks
          curl -fsSL "https://raw.githubusercontent.com/$OWNER/$REPO/$GITHUB_REF_NAME/packaging/homebrew/siminstall.rb" \
            | sed -e "s/^  version \".*\"/  version \"$VERSION\"/" \
                  -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" \
                  -e "s#github.com/OWNER/siminstall#github.com/$OWNER/$REPO#g" \
            > tap/Casks/siminstall.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/siminstall.rb
          git commit -m "siminstall $VERSION" && git push
